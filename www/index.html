<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ICU杯</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f9fafb;
        color: #0f172a;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap {
        padding: 24px;
      }
      h1 {
        color: #047857;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        font-size: 14px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- これは接続失敗時のフォールバック画面。通常は server.url の本番サイトが表示される -->
    <div class="wrap">
      <h1>ICU杯</h1>
      <p>サーバーに接続できませんでした。<br />ネットワークを確認してください。</p>
    </div>
  </body>
</html>
